services:
  postgres:
    image: postgres:latest
    container: notes-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: notes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 6s
      timeout: 6s
      retries: 5

  api:
    build: ./backend
    container_name: notes-api
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "np run prisma-push-gen && npm run seed && npm run start:dev"
    restart: unless-stopped